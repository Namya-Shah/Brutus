[package]
name = "brutus"
version = "0.1.0"
edition = "2021"
description = "Fast, parallel agent IDE and workspace manager"
license = "MIT OR Apache-2.0"

[dependencies]
tokio = { version = "1.38", features = ["full", "rt-multi-thread", "macros", "sync", "process", "fs", "io-util", "signal"] }
eframe = { version = "0.31", features = ["wgpu"] }
notify = { version = "6.1", features = ["mio"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "1.0"
async-trait = "0.1"
futures = "0.3"
open = "5.3"

